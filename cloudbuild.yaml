steps:
  # Canonical Artifact Registry image path for this deployment.
  # The trigger already provides these substitutions.
  # Result: europe-west8-docker.pkg.dev/<project>/<repo>/virtual-persona-backend:<tag>
  # Build the Docker image with FAISS index baked in
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    secretEnv: ['OPENAI_API_KEY']
    args:
      - '-c'
      - |
        docker build \
          --build-arg OPENAI_API_KEY="$$OPENAI_API_KEY" \
          -t ${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/virtual-persona-backend:$SHORT_SHA \
          -t ${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/virtual-persona-backend:latest \
          -f services/api/Dockerfile.backend \
          .

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/virtual-persona-backend'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'virtual-persona-backend'
      - '--image'
      - '${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/virtual-persona-backend:$SHORT_SHA'
      - '--region'
      - 'europe-west8'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--timeout'
      - '300'
      - '--add-cloudsql-instances'
      - '${_CLOUDSQL_INSTANCE_CONNECTION_NAME}'
      - '--remove-env-vars'
      - 'GEMINI_API_KEY,OPENAI_API_KEY,DATABASE_URL,CLOUD_SQL_CONNECTION_NAME,POSTGRES_ENABLED,POSTGRES_HOST,POSTGRES_PORT,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_SSLMODE'
      - '--update-env-vars'
      - 'POSTGRES_ENABLED=true,CLOUD_SQL_CONNECTION_NAME=${_CLOUDSQL_INSTANCE_CONNECTION_NAME},POSTGRES_PORT=5432,POSTGRES_DB=${_POSTGRES_DB},POSTGRES_USER=${_POSTGRES_USER},POSTGRES_SSLMODE=disable'
      - '--update-secrets'
      - 'GEMINI_API_KEY=GEMINI_API_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,POSTGRES_PASSWORD=POSTGRES_PASSWORD:latest'

substitutions:
  _CLOUDSQL_INSTANCE_CONNECTION_NAME: 'virtualpersonacv:europe-west8:virtual-persona-db'
  _POSTGRES_DB: 'virtual_persona'
  _POSTGRES_USER: 'app_user'

# Reference secrets from Secret Manager
availableSecrets:
  secretManager:
    - versionName: projects/831351726786/secrets/OPENAI_API_KEY/versions/1
      env: 'OPENAI_API_KEY'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'  # Use more CPU for faster FAISS index builds

timeout: '1800s'  # 30 minutes timeout for the entire build (FAISS indexing can take time)
