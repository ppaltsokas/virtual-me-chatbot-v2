steps:
  # Build the Docker image with FAISS index baked in
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    secretEnv: ['OPENAI_API_KEY']
    args:
      - '-c'
      - |
        docker build \
          --build-arg OPENAI_API_KEY="$$OPENAI_API_KEY" \
          -t gcr.io/$PROJECT_ID/virtual-persona-backend:$SHORT_SHA \
          -t gcr.io/$PROJECT_ID/virtual-persona-backend:latest \
          -f services/api/Dockerfile.backend \
          .

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/virtual-persona-backend'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'virtual-persona-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/virtual-persona-backend:$SHORT_SHA'
      - '--region'
      - 'europe-west8'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--timeout'
      - '300'
      - '--update-secrets'
      - 'GEMINI_API_KEY=GEMINI_API_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest'

# Reference secrets from Secret Manager
availableSecrets:
  secretManager:
    - versionName: projects/831351726786/secrets/OPENAI_API_KEY/versions/1
      env: 'OPENAI_API_KEY'
    - versionName: projects/831351726786/secrets/GEMINI_API_KEY/versions/latest
      env: 'GEMINI_API_KEY'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'  # Use more CPU for faster FAISS index builds

timeout: '1800s'  # 30 minutes timeout for the entire build (FAISS indexing can take time)
